spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/garden}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8083

# Set these only as server secrets to create the first administrator once.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:true}
server.servlet.session.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
