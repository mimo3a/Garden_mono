# Mosquitto configuration for Smart Garden.
# Template: the server copy is ./mosquitto.conf next to docker-compose.yml
# (/srv/projects/garden/backend/). Procedure: docs/SECURITY_SETUP.md, section MQTT.
listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd
acl_file /mosquitto/config/mosquitto_acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
connection_messages true
