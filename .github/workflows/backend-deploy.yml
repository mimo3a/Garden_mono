name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'garden-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: garden-backend
          push: true
          tags: ghcr.io/mimo3a/garden-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: docker-compose.yml
          target: /srv/projects/garden/backend/

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GHCR_TOKEN,APP_BOOTSTRAP_ADMIN_EMAIL,APP_BOOTSTRAP_ADMIN_PASSWORD
          script: |
            cd /srv/projects/garden/backend
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mimo3a --password-stdin
            docker compose pull backend
            # `latest` is a mutable tag. Force recreation so a successfully
            # pulled image is always the process that serves the API.
            docker compose up -d --no-deps --force-recreate backend
            docker compose ps backend
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.APP_BOOTSTRAP_ADMIN_EMAIL }}
          APP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.APP_BOOTSTRAP_ADMIN_PASSWORD }}
